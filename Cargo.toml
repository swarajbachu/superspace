[workspace]
resolver = "2"
members = [
    "apps/superspace",
    "apps/superspace-extension",
    "crates/ai",
    "crates/calculator",
    "crates/core",
    "crates/extensions",
    "crates/network",
    "crates/platform",
    "crates/protocol",
    "crates/productivity",
    "crates/storage",
    "crates/sync",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/swaraj/superspace"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
arboard = { version = "3.6", features = ["wayland-data-control"] }
blake3 = { version = "1.8", features = ["pure"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
fs2 = "0.4"
mdns-sd = { version = "0.21", default-features = false }
png = "0.18"
plist = "1.8"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rust_decimal = "1.42"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
snow = "0.10"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
tempfile = "3.22"
tokio = { version = "1.47", features = ["io-util", "macros", "rt-multi-thread", "time"] }
wasmparser = "0.239"
wasmtime = { version = "36.0", default-features = false, features = ["component-model", "cranelift", "runtime"] }
wit-parser = "0.236"
gpui = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a" }
gpui_platform = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a", features = ["wayland", "x11", "font-kit", "runtime_shaders"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
