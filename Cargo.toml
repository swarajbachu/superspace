[workspace]
resolver = "2"
members = [
    "apps/superspace",
    "crates/ai",
    "crates/calculator",
    "crates/core",
    "crates/extensions",
    "crates/network",
    "crates/protocol",
    "crates/storage",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/swaraj/superspace"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
snow = "0.10"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
tempfile = "3.22"
wasmparser = "0.239"
wasmtime = { version = "36.0", default-features = false, features = ["component-model", "cranelift", "runtime"] }
gpui = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a" }
gpui_platform = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a", features = ["wayland", "x11", "font-kit", "runtime_shaders"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
